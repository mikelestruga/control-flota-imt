const fmtPat=v=>{const i=v.id;if(/^[A-Z]{4}\d{2}$/.test(i))return i.slice(0,4)+"-"+i.slice(4);if(/^[A-Z]{2}\d{4}$/.test(i))return i.slice(0,2)+"-"+i.slice(2);if(/^[A-Z]{3}\d{3}$/.test(i))return i.slice(0,3)+"-"+i.slice(3);return i};
const fdate=d=>{const[a,b,c]=(d||"").split("-");return c?`${c}/${b}/${a}`:""};
/* ===== Vales de lavado: normal (LV) y de chasis (LCH, máximo 1 por patente al mes) ===== */
const isCh=v=>v.kind==="chasis";
const VK={n:{t:"Vale de lavado",ic:"🧼",pre:"LV",cnt:"lv",base:yy=>yy===26?145:0},c:{t:"Vale Lavado de Chasis",ic:"🚿",pre:"LCH",cnt:"lc",base:()=>0}};
const vkOf=v=>isCh(v)?"c":"n";
let LVK="n",LVF="",LPQ="",LPT="",LPS="pat",LPM="";
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mesTxt=m=>{const[a,b]=(m||"").split("-");return b?MESL[+b-1]+" "+a:""};
const vKey=v=>v.vid||np(v.plate);
const valesMes=(m,k)=>VL.filter(v=>(v.fecha||"").slice(0,7)===m&&(!k||vkOf(v)===k));
function nextNumVal(k){k=k||LVK;const yy=new Date().getFullYear()%100,c=k==="c"?CTC:CT;return Math.max(c,VK[k].base(yy),...VL.filter(v=>v.yy===yy&&vkOf(v)===k).map(v=>v.num))+1}
const lvCounts=()=>{const m=today().slice(0,7);return Object.entries(VK).map(([k,x])=>`<button type="button" id="lvk_${k}" class="${LVK===k?"p":""}" onclick="lvKind('${k}')" style="flex:1;min-height:64px;text-align:left;padding:8px 12px"><div style="font-weight:700">${x.ic} ${x.t}</div><div style="font-size:13px;font-weight:500;opacity:.9">${valesMes(m,k).length} emitido(s) en ${mesTxt(m)}</div></button>`).join("")};
function lvKind(k){LVK=k;const c=$("#lv_k");if(c)c.innerHTML=lvCounts();const t=$("#lv_t");if(t)t.textContent=VK[k].ic+" Nuevo "+VK[k].t.toLowerCase().replace("vale lavado de chasis","vale de lavado de chasis");const n=$("#l_n");if(n&&n.dataset.dirty!=="1")n.value=nextNumVal(k);const b=$("#lv_b");if(b)b.textContent=k==="c"?"Crear vale de lavado de chasis y generar PDF":"Crear vale y generar PDF";lpc()}
function lpc(){const e=$("#l_pc");if(!e)return;const v=V.find(x=>x.id===$("#l_p").value),pt=np(($("#l_pt")||{}).value||""),key=v?v.id:pt;if(!key){e.innerHTML="";return}
const m=(($("#l_d")||{}).value||today()).slice(0,7),vs=valesMes(m).filter(x=>vKey(x)===key||np(x.plate)===pt),n=vs.filter(x=>!isCh(x)).length,c=vs.filter(isCh).length;
e.innerHTML=`<div style="background:var(--bg2);border-radius:8px;padding:8px 10px;margin-top:4px"><div class="mu" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em">Vales de esta patente en ${H(mesTxt(m))}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><span class="b" style="color:var(--ac)">🧼 ${n} vale(s) de lavado</span><span class="b ${c?"er":"ok"}">🚿 ${c} vale(s) de lavado de chasis</span></div>${LVK==="c"&&c?'<div class="er" style="margin-top:6px;font-weight:600">⚠ Esta patente ya tiene un Vale de Lavado de Chasis emitido este mes.</div>':""}</div>`}
const lpRows=()=>{const m=LPM||today().slice(0,7),vs=valesMes(m),map=new Map();
V.filter(v=>!v.sold).forEach(v=>map.set(v.id,{key:v.id,pat:fmtPat(v),mod:vname(v),tipo:tp(v),n:0,c:0}));
vs.forEach(x=>{const k=vKey(x);if(!map.has(k)){const v=VALL.find(y=>y.id===k);map.set(k,{key:k,pat:v?fmtPat(v):(x.plate||k),mod:v?vname(v):(x.vehicle||""),tipo:v?tp(v):"Fuera de la flota",n:0,c:0})}const r=map.get(k);isCh(x)?r.c++:r.n++});
const qq=normN(LPQ);let f=[...map.values()].filter(r=>(!LPT||r.tipo===LPT)&&(!qq||normN(r.pat+" "+r.mod).includes(qq)));
f.sort(LPS==="mod"?(a,b)=>normN(a.mod).localeCompare(normN(b.mod))||a.pat.localeCompare(b.pat):LPS==="cant"?(a,b)=>(b.n+b.c)-(a.n+a.c)||a.pat.localeCompare(b.pat):(a,b)=>a.pat.localeCompare(b.pat));return f};
function lpList(){const f=lpRows(),m=LPM||today().slice(0,7);
return `<div class="mu" style="margin:6px 0">${f.length} patente(s) · ${mesTxt(m)}</div>`+(f.map(r=>`<div class="row" style="align-items:center"><div style="min-width:0"><b class="pl" style="font-size:16px">${H(r.pat)}</b> <span class="mu">${H(r.mod)}</span><div class="mu" style="font-size:12px">${H(r.tipo)}</div></div><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="b" style="color:${r.n?"var(--ac)":"var(--mu)"}" title="Vales de lavado">🧼 ${r.n}</span><span class="b" style="color:${r.c?"var(--ok)":"var(--mu)"}" title="Vales de lavado de chasis">🚿 ${r.c}</span></span></div>`).join("")||'<div class="mu">Sin resultados.</div>')}
function lpDraw(){const e=$("#lp_list");if(e)e.innerHTML=lpList()}
const lpCard=()=>sect("lvpat","📋 Vales por patente (contador mensual)",`<div class="g"><div><label>Mes</label><input type="month" value="${H(LPM||today().slice(0,7))}" onchange="LPM=this.value;lpDraw()"></div><div><label>Tipo de vehículo</label><select onchange="LPT=this.value;lpDraw()"><option value="">Todos</option>${[...tipos(),"Fuera de la flota"].map(t=>`<option${LPT===t?" selected":""}>${H(t)}</option>`).join("")}</select></div><div><label>Ordenar por</label><select onchange="LPS=this.value;lpDraw()"><option value="pat"${LPS==="pat"?" selected":""}>Patente</option><option value="mod"${LPS==="mod"?" selected":""}>Modelo de vehículo</option><option value="cant"${LPS==="cant"?" selected":""}>Más vales primero</option></select></div></div>
<input type="search" placeholder="🔍 Buscar por patente o modelo" value="${H(LPQ)}" oninput="LPQ=this.value;lpDraw()" style="margin-top:8px"><div id="lp_list">${lpList()}</div>`,false);
const lvList=()=>{const rec=[...VL].filter(v=>!LVF||vkOf(v)===LVF).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.yy-a.yy)||(b.num-a.num));
return rec.length?rec.map(v=>`<div class="row"><div><b>${H(v.code)}</b> · ${H(fdate(v.fecha))} <span class="b" style="color:${isCh(v)?"var(--ok)":"var(--ac)"}">${isCh(v)?"🚿 Chasis":"🧼 Lavado"}</span><div>${H(v.plate||"")} · ${H(v.vehicle||"")}</div><div class="mu">${H(v.faena||"")} · Solicita: ${H(v.solicitante||"")}</div></div><span style="white-space:nowrap"><button onclick="valePdf('${v.id}')">📄 PDF</button> <button onclick="delVale('${v.id}')" title="Eliminar">🗑</button></span></div>`).join(""):'<div class="mu">Aún no hay vales.</div>'};

${lpCard()}

al(`Vale ${r.code} creado ✔`);valePdf(id,r)}

function start(){started=true;setMode("")}
async function repMes(){const m=$("#rp_m").value;if(!m)return al("Elige el mes");
const all=VL.filter(v=>(v.fecha||"").slice(0,7)===m).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||(a.yy-b.yy)||(a.num-b.num));
if(!all.length)return al("No hay vales en ese mes");if(!window.ExcelJS)return al("No se pudo cargar el generador de Excel");
const km=v=>+String(v.km||"").replace(/[^0-9]/g,"")||null;
const thin={style:"thin",color:{argb:"FF000000"}},bd={top:thin,left:thin,bottom:thin,right:thin};
const head=(r,col)=>{r.height=24;r.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"},size:11};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:col}};c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=bd})};
const title=(ws,t,n,col)=>{const r=ws.addRow([t]);ws.mergeCells(r.number,1,r.number,n);r.height=26;const c=r.getCell(1);c.font={bold:true,size:13,color:{argb:col}};c.alignment={vertical:"middle"}};
const wb=new ExcelJS.Workbook(),C={n:"FF1C5DA8",c:"FF1F7A49"};
const detail=(k,name)=>{const rows=all.filter(v=>vkOf(v)===k),ws=wb.addWorksheet(name);
ws.columns=[{width:13},{width:19},{width:12},{width:28},{width:14},{width:26},{width:22},{width:28}];
title(ws,`${k==="c"?"Vales de lavado de chasis":"Vales de lavado"} · ${mesTxt(m)}`,8,C[k]);
const hr=ws.addRow(["N° de vale","Fecha de solicitud","Patente","Modelo de vehículo","Kilometraje","Solicitante","Autoriza","Faena / asignación"]);head(hr,C[k]);
if(!rows.length){const r=ws.addRow(["Sin vales en el mes"]);ws.mergeCells(r.number,1,r.number,8)}
rows.forEach(v=>{const r=ws.addRow([v.code,fdate(v.fecha),v.plate,v.vehicle,km(v),v.solicitante,v.encargado||"CARLOS MURO",v.faena||""]);r.eachCell({includeEmpty:true},(c,n)=>{c.border=bd;c.alignment={vertical:"middle",horizontal:n===5?"right":n<=3?"center":"left"};if(n===5)c.numFmt="#,##0"})});
const tr=ws.addRow(["Total de vales",rows.length]);tr.eachCell({includeEmpty:true},c=>{c.border=bd;c.font={bold:true}});
ws.views=[{state:"frozen",ySplit:2}];if(rows.length)ws.autoFilter={from:{row:2,column:1},to:{row:2,column:8}}};
